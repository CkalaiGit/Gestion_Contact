server:
  port: 8080
  error:
    include-message: always

spring:
  threads:
    virtual:
      enabled: true
  mvc:
    hiddenmethod:
      filter:
        enabled: true

  datasource:
    url: jdbc:h2:mem:contactsdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      # Nombre maximum de connexions simultanées à la BDD
      # (Gardez une valeur raisonnable, entre 10 et 50 selon votre serveur BDD)
      maximum-pool-size: 30
      # Temps d'attente (ms) pour obtenir une connexion avant de rejeter la requête
      connection-timeout: 20000
      # Nom du pool pour le monitoring
      pool-name: HikariVirtualPool

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always
      platform: h2

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 1093207503972-jaokg1895q22rqqn675btoaaojdg7psg.apps.googleusercontent.com
            client-secret: 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
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            issuer-uri: https://accounts.google.com

app:
  jwt:
    secret: "WjKqTz8cY5XwT6sV3p9uLBTy1H4q8DM7L3f9mGz2Q0hXc9BjNl4fS6KqV1zMr8Pwz7tZqXH1dP4c8sBr6YsV3w=="
    expiration-in-seconds: 604800   # 7 jours
